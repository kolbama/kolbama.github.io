  u = String(u || '').trim();
  if (!u) return '';
  if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u;
  return /^https?:\/\/[^\s]+$/i.test(u) ? u : '';

  })).filter(r => r.roles.length);
  if (!rows.length) return 0;
  const { error } = await sb.from('projects').insert(rows);
  return error ? 0 : rows.length;
}

async function loadAll() {
  const res = await Promise.all([
    sb.from('profiles').select('*'),
    sb.from('private_contacts').select('*'),
    sb.rpc('approved_counts'),
    sb.from('projects').select('*').order('created_at', { ascending: false }),
    sb.from('applications').select('*').order('created_at', { ascending: false }),
    sb.from('messages').select('*').order('created_at'),
    sb.from('blocks').select('blocked_id'),
    sb.rpc('is_admin')
  ]);
  const bad = res.find(r => r.error);
  if (bad) throw bad.error;
  const [profiles, contacts, counts, projects, apps, messages, blocks, isAdmin] = res.map(r => r.data);
  S.isAdmin = isAdmin === true;
  S.blocked = new Set(blocks.map(b => b.blocked_id));
  const visible = id => !S.blocked.has(id); // people I blocked disappear from my screens
  S.profiles = Object.fromEntries(profiles.map(p => [p.id, p]));
  S.phones = Object.fromEntries(contacts.map(c => [c.user_id, c.phone]));
  S.counts = Object.fromEntries(counts.map(c => [c.user_id, Number(c.completed)]));
  S.projects = projects.map(toProject).filter(p => visible(p.uid));
  S.pros = profiles.filter(p => p.seeking && p.skills.length && visible(p.id)).map(toPro);
  S.apps = apps.map(toApp).filter(a => a && visible(a.applicantUid) && visible(a.ownerUid));
  S.messages = messages.filter(m => visible(m.sender_id) && visible(m.recipient_id));
  const me = S.profiles[S.uid];
  S.user = me ? {
    uid: me.id,
    name: me.name,
    loc: me.loc,
    region: me.region,
    phone: S.phones[me.id] || '',
    skills: me.skills,
    seeking: me.seeking,
    studioOrGear: me.studio_or_gear,
    past: me.past,
    link: me.link,
    termsAccepted: !!me.terms_accepted_at
  } : null;
}

async function adminLoad() {

  const [stats, reports] = await Promise.all([

  ]);
  if (stats.error || reports.error) { toast('לא הצלחנו לטעון את נתוני הניהול'); return; }
  S.admin.stats = stats.data;
  S.admin.reports = reports.data;
}

// Re-draw after a change from someone else, without wiping what the user is typing
function refreshView() {
  if (!S.user || S.onboardingType) return;
  const typing = document.activeElement && document.activeElement.matches('input[data-k]');
  if (typing) {
    const l = $('#list');
    if (l) l.innerHTML = renderTabContent();
  } else {
    $('#main').innerHTML = mainView();
  }
  if (S.modal === 'chat') {
    const draft = $('#modal input[name="msg"]');
    const text = draft ? draft.value : '';
    const hadFocus = draft && document.activeElement === draft;
    renderModal();
    const i = $('#modal input[name="msg"]');
    if (i) { i.value = text; if (hadFocus) i.focus(); }
  }
}

let reloadTimer;
function scheduleReload() {
  clearTimeout(reloadTimer);
  reloadTimer = setTimeout(async () => {
    try { await loadAll(); refreshView(); } catch (e) { console.error(e); }
  }, 300);
}

async function boot() {
  render();
  try {
    let { data: { session } } = await sb.auth.getSession();
    if (!session) {
      const { data, error } = await sb.auth.signInAnonymously();
      if (error) throw error;
      session = data.session;
    }
    S.uid = session.user.id;
    await loadAll();
    sb.channel('kol-bama')
      .on('postgres_changes', { event: '*', schema: 'public' }, scheduleReload)
      .subscribe();
  } catch (e) {
    console.error(e);
    S.error = 'לא הצלחנו להתחבר לשרת. בדוק את החיבור לאינטרנט ונסה שוב.';
  }
  S.ready = true;
  render();
}

// Runs a database call; on failure shows a message and returns false
async function db(call, failMsg) {
  const { error } = await call;
  if (error) {
    console.error(error);
    toast(failMsg || 'משהו השתבש. נסה שוב.');
    return false;
  }
  return true;
}

function isMine(item) {

function hasApplied(projId) {
  return S.apps.some(a => a.projId == projId && a.applicantUid === S.uid);
}

// Messages between me and one other person, optionally about one project
function threadMessages(otherId, projId) {
  return S.messages.filter(m =>
    ((m.sender_id === S.uid && m.recipient_id === otherId) || (m.sender_id === otherId && m.recipient_id === S.uid))
    && String(m.project_id || '') === String(projId || ''));
}

function conversations() {
  const map = new Map();
  S.messages.forEach(m => {
    const otherId = m.sender_id === S.uid ? m.recipient_id : m.sender_id;
    map.set(otherId + ':' + (m.project_id || ''), { otherId, projId: m.project_id, last: m });
  });
  return [...map.values()].sort((a, b) => b.last.created_at.localeCompare(a.last.created_at));
}

function formatWaPhone(phone) {
  const digits = String(phone || '').replace(/\D/g, '');
  if (!digits) return '';
  if (digits.startsWith('972')) return digits;
  if (digits.startsWith('0')) return '972' + digits.slice(1);
  return '972' + digits;
}

function linkHtml(link, text) {
  const url = safeUrl(link);
  return url ? `<a class="ext-link" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${text}</a>` : '';
}

        ${projRoles(p).map(r => `<span class="role-tag">דרוש: ${esc(ROLES[r] || r)}</span>`).join('')}
      </div>
    </div>
    <div class="bd">
      <div class="meta">
        <span>👤 יוצר: <b>${esc(p.creator)}</b> ${p.studio ? `(${esc(p.studio)})` : ''}</span>
        <span>📍 מיקום: <b>${esc(p.loc)}</b>${p.region ? ` (${esc(p.region)})` : ''}</span>
        <span>📅 לו״ז: <b>${esc(p.dates)}</b></span>
        ${p.deadline && open ? `<span>⏰ הגשה עד: <b>${esc(dateLabel(p.deadline))}</b></span>` : ''}
      </div>
      <div>${esc(p.desc)}</div>
      ${p.tech ? `<div class="note" style="background:var(--in);padding:8px 12px;border-radius:8px;border:1px solid var(--line)">🔧 <b>מפרט טכני / דגשים:</b> ${esc(p.tech)}</div>` : ''}
      <div class="row" style="margin-top:6px">
        ${!mine ? (hasApplied(p.id)
          ? `<span class="chip verified">✓ הגשת מועמדות</span>`
          : open ? `<button class="btn" data-a="apply-open" data-id="${esc(p.id)}">הגש מועמדות</button>` : '') : ''}
        ${!mine ? `<button class="btn ghost sm" data-a="chat" data-other="${esc(p.uid)}" data-proj="${esc(p.id)}">💬 שאל את היוצר</button>` : ''}
        ${open ? `<button class="btn ghost sm" data-a="share-wa" data-id="${esc(p.id)}">📲 שתף בוואטסאפ</button>` : ''}
        ${!mine ? `<button class="btn ghost sm" data-a="report" data-other="${esc(p.uid)}" data-proj="${esc(p.id)}" aria-label="דווח על המודעה">🚩</button>` : ''}
        ${mine ? `
          ${p.status === 'filled'
            ? `<button class="btn ghost sm" data-a="toggle-filled" data-id="${esc(p.id)}">↩️ פתח מחדש</button>`
            : `<button class="btn ok sm" data-a="toggle-filled" data-id="${esc(p.id)}">✅ מצאנו, תודה!</button>`}
          <button class="btn ghost sm" data-a="edit-proj" data-id="${esc(p.id)}">✏️ ערוך</button>
          <button class="btn ghost sm" data-a="del" data-id="${esc(p.id)}">🗑️ מחק</button>
        ` : ''}
      </div>
    </div>
  </article>`;
}

function renderTabContent() {
  const q = S.q.trim().toLowerCase();
  const hit = (...f) => !q || f.join(' ').toLowerCase().includes(q);

  if (S.tab === 'board') {
    if (S.focusId) {
      const p = S.projects.find(x => String(x.id) === S.focusId);
      return `<div class="note focus-bar">
          <span>${p ? 'מוצגת הפקה אחת מקישור ששותף.' : 'ההפקה מהקישור לא נמצאה. ייתכן שנמחקה.'}</span>
          <button class="btn ghost sm" data-a="unfocus">הצג את כל הפרויקטים</button>
        </div>${p ? projectCard(p) : ''}`;
    }

    const arr = S.projects.filter(p => {
      const matchRole = S.role === 'all' || projRoles(p).includes(S.role);
      const matchFrame = S.frame === 'all' || p.frame === S.frame;
      const matchMedium = S.medium === 'all' || (p.medium || 'theater') === S.medium;
      const matchRegion = S.region === 'all' || p.region === S.region;
      return hit(p.title, p.loc, p.region, p.desc, p.tech, p.creator, p.format) && matchRole && matchFrame && matchMedium && matchRegion;
    }).sort((a, b) => isOpen(b) - isOpen(a)); // closed ones sink to the bottom

    if (!arr.length) {
      return `<div class="empty">
        <h3 style="font-size:22px;color:var(--tx);margin-bottom:6px">${S.projects.length ? 'אין פרויקטים שמתאימים לחיפוש' : 'לוח הפרויקטים נקי'}</h3>
        <p style="margin:0 0 16px">${S.projects.length ? 'נסה לשנות את הסינון.' : 'עדיין אין הפקות רשומות בלוח. היה הראשון לפרסם הצגה או סרט ולגייס צוות.'}</p>
        <button class="btn" data-a="open" data-id="proj">+ פרסם פרויקט</button>
      </div>`;
    }

    return arr.map(projectCard).join('');
  }

  if (S.tab === 'pros') {
    const arr = S.pros.filter(p => hit(p.name, p.loc, p.region, p.past, p.studioOrGear)
      && (S.role === 'all' || skillsOf(p).includes(S.role))
      && (S.region === 'all' || p.region === S.region));
    if (!arr.length) {
      return `<div class="empty">
        <h3 style="font-size:22px;color:var(--tx);margin-bottom:6px">אין כרגע פרופילים להצגה</h3>
        <p style="margin:0 0 16px">מי שמסמן בפרופיל ״אני מחפש/ת עבודה״ מופיע כאן עם הניסיון והציוד שלו.</p>
        ${!S.user.seeking ? `<button class="btn" data-a="edit-profile">+ הוסף את עצמי לאינדקס</button>` : ''}
      </div>`;
    }
    return arr.map(p => {
      const mine = isMine(p);
      const link = linkHtml(p.link, '🔗 צפייה בתיק עבודות / אינסטגרם');
      return `<article class="card">
        <div class="hd">
          <div class="row" style="justify-content:space-between">
            <div class="need-tags" style="margin:0">${skillsOf(p).map(s => `<span class="role-tag">${esc(ROLES[s] || s)}</span>`).join('')}</div>
            <span class="chip verified">✓ ${p.completed || 0} הפקות ב״קול במה״</span>
          </div>
          <h3>${esc(p.name)}</h3>
        </div>
        <div class="bd">
          <div class="meta">
            <span>📍 ${esc(p.loc)}${p.region ? ` (${esc(p.region)})` : ''}</span>
            ${p.studioOrGear ? `<span>🎛️ <b>ציוד/כלים:</b> ${esc(p.studioOrGear)}</span>` : ''}
          </div>
          <div><b>ניסיון והפקות קודמות:</b> ${esc(p.past)}</div>
          ${link ? `<div>${link}</div>` : ''}
          <div class="row" style="margin-top:6px">
            ${mine
              ? `<button class="btn ghost sm" data-a="edit-profile">✏️ ערוך את הפרופיל שלי</button>`
              : `<button class="btn" data-a="chat" data-other="${esc(p.uid)}" data-proj="">💬 שלח הודעה</button>
                 <button class="btn ghost sm" data-a="report" data-other="${esc(p.uid)}" data-proj="" aria-label="דווח על הפרופיל">🚩</button>`}
          </div>
        </div>
      </article>`;
    }).join('');
  }

  if (S.tab === 'apps') {
    const convs = conversations();
    const convHtml = convs.length ? `<h3 class="section-title">שיחות</h3>` + convs.map(c => {
      const proj = c.projId ? S.projects.find(p => p.id === c.projId) : null;
      const fromMe = c.last.sender_id === S.uid;
      return `<button class="conv" data-a="chat" data-other="${esc(c.otherId)}" data-proj="${esc(c.projId || '')}">
        <span style="min-width:0">
          <b>${esc(nameOf(c.otherId))}</b>${proj ? ` · <span style="color:var(--gold)">${esc(proj.title)}</span>` : ''}
          <div class="last">${fromMe ? 'את/ה: ' : ''}${esc(c.last.body)}</div>
        </span>
        <span class="note" style="margin:0;white-space:nowrap">${esc(timeLabel(c.last.created_at))}</span>
      </button>`;
    }).join('') : '';

    const myApps = S.apps;
    if (!myApps.length) {
      return convHtml + `<div class="empty">
        <h3 style="font-size:22px;color:var(--tx);margin-bottom:6px">אין כרגע מועמדויות פעילות</h3>
        <p style="margin:0">כשתגיש מועמדות לפרויקט או כשיפנו לפרויקט שפרסמת – הכל יופיע כאן לאישור.</p>
      </div>`;
    }
    return convHtml + `<h3 class="section-title">מועמדויות</h3>` + myApps.map(a => {
      const isOwner = a.ownerUid === S.uid;
      const partnerPhone = isOwner ? a.applicantPhone : a.ownerPhone;
      const partnerName = isOwner ? a.applicantName : a.ownerName;
      const partnerUid = isOwner ? a.applicantUid : a.ownerUid;
      const waDigits = formatWaPhone(partnerPhone);
      const waText = encodeURIComponent(`היי ${partnerName || ''}! אנחנו מחוברים דרך "קול במה" לגבי ההפקה "${a.projTitle}".`);
      const link = linkHtml(a.applicantLink, '🔗 קישור לתיק עבודות / אינסטגרם');

      return `<article class="card">
        <div class="hd">
          <div class="row" style="justify-content:space-between">
            <span class="chip">${isOwner ? 'פנייה נכנסת לפרויקט שלך:' : 'מועמדות ששלחת לפרויקט:'} <b>${esc(a.projTitle)}</b></span>
            <span class="role-tag">${esc(ROLES[a.role] || a.role)}</span>
          </div>
          <h3>${esc(a.applicantName)} <span style="font-size:14px;font-weight:400;color:var(--mut)">(${esc(a.applicantLoc)})</span></h3>
        </div>
        <div class="bd">
          ${a.applicantGear ? `<div class="meta">🎛️ <b>ציוד / מסגרת:</b> ${esc(a.applicantGear)}</div>` : ''}
          <div><b>ניסיון קודם:</b> ${esc(a.applicantPast)}</div>
          ${link ? `<div>${link}</div>` : ''}
          <div style="background:var(--in);padding:10px 12px;border-radius:10px;border:1px solid var(--line)">
            💬 <b>הודעת המועמד:</b> "${esc(a.note)}"
          </div>
          <div class="row" style="margin-top:6px">
            ${a.status === 'pending' ? (
              isOwner ? `
                <button class="btn ok" data-a="app-approve" data-id="${esc(a.id)}">✓ אשר מועמד ופתח קשר</button>
                <button class="btn ghost" data-a="app-decline" data-id="${esc(a.id)}">דחה פנייה</button>
              ` : `<span class="chip">⏳ ממתין לאישור היוצר (${esc(a.ownerName || '')})</span>`
            ) : a.status === 'approved' ? `
              <span class="chip verified">✓ מועמדות אושרה!</span>
              <button class="btn sm" data-a="chat" data-other="${esc(partnerUid)}" data-proj="${esc(a.projId)}">💬 צ׳אט באפליקציה</button>
              ${waDigits ? `<a class="btn wa sm" href="https://wa.me/${waDigits}?text=${waText}" target="_blank" rel="noopener">📲 עבור לוואטסאפ (${esc(partnerPhone)})</a>` : ''}
            ` : `<span class="chip">פנייה נדחתה</span>`}
          </div>
        </div>
      </article>`;
    }).join('');
  }

  if (S.tab === 'admin' && S.isAdmin) {
    const st = S.admin.stats || {};
    const stat = (n, label) => `<div class="stat"><b>${esc(n == null ? '–' : n)}</b><span>${esc(label)}</span></div>`;
    const reports = S.admin.reports.filter(r => S.admin.showHandled || !r.handled);
    const users = Object.values(S.profiles).sort((a, b) => b.created_at.localeCompare(a.created_at));
    const projTitle = id => (S.projects.find(p => p.id === id) || {}).title;
    const day = iso => new Date(iso).toLocaleDateString('he-IL');

    return `
      <h3 class="section-title">מבט על</h3>
      <div class="stats">
        ${stat(st.profiles, 'פרופילים')}
        ${stat(st.seeking, 'מחפשים עבודה')}
        ${stat(st.open_projects, 'פרויקטים פתוחים')}
        ${stat(st.projects, 'פרויקטים בסך הכול')}
        ${stat(st.applications, 'מועמדויות')}
        ${stat(st.approved, 'מועמדויות שאושרו')}
        ${stat(st.messages, 'הודעות')}
        ${stat(st.visitors, 'כניסות לאתר (כולל בלי הרשמה)')}
      </div>
      <p class="note" style="margin:0">את תוכן ההודעות ומספרי הטלפון גם המנהל לא רואה, כמו שכתוב בתנאי השימוש.</p>

      <div class="row" style="justify-content:space-between">
        <h3 class="section-title">🚩 דיווחים ${st.open_reports ? `<span class="badge">${st.open_reports}</span>` : ''}</h3>
        <button class="btn ghost sm" data-a="admin-toggle-handled">${S.admin.showHandled ? 'הסתר דיווחים שטופלו' : 'הצג גם דיווחים שטופלו'}</button>
      </div>
      ${reports.length ? reports.map(r => `<article class="card"${r.handled ? ' style="opacity:.6"' : ''}><div class="bd">
        <div class="row" style="justify-content:space-between">
          <span class="role-tag">${esc(r.reason)}</span>
          <span class="note" style="margin:0">${esc(timeLabel(r.created_at))}</span>
        </div>
        <div class="meta">
          <span>מדווח/ת: <b>${esc(nameOf(r.reporter_id))}</b></span>
          ${r.reported_user_id ? `<span>על: <b>${esc(S.profiles[r.reported_user_id] ? nameOf(r.reported_user_id) : 'משתמש שנמחק')}</b></span>` : ''}
          ${r.project_id ? `<span>פרויקט: <b>${esc(projTitle(r.project_id) || 'נמחק')}</b></span>` : ''}
        </div>
        ${r.details ? `<div>${esc(r.details)}</div>` : ''}
        <div class="row">
          <button class="btn ${r.handled ? 'ghost' : 'ok'} sm" data-a="report-handled" data-id="${esc(r.id)}">${r.handled ? '↩️ סמן כלא טופל' : '✓ סמן כטופל'}</button>
          ${r.project_id && projTitle(r.project_id) ? `<button class="btn ghost sm" data-a="admin-del-proj" data-id="${esc(r.project_id)}">🗑️ מחק את הפרויקט</button>` : ''}
          ${r.reported_user_id && S.profiles[r.reported_user_id] && r.reported_user_id !== S.uid ? `<button class="btn ghost sm" data-a="admin-del-user" data-id="${esc(r.reported_user_id)}">⛔ מחק את המשתמש</button>` : ''}
        </div>
      </div></article>`).join('') : '<div class="empty" style="padding:20px">אין דיווחים פתוחים 🎉</div>'}

      <h3 class="section-title">👥 משתמשים (${users.length})</h3>
      ${users.map(u => `<div class="admin-row">
        <span>
          <b>${esc(u.name)}</b>
          <span class="note">· ${esc(u.loc)}${u.region ? ` (${esc(u.region)})` : ''} · נרשם/ה ${esc(day(u.created_at))}${u.seeking ? ' · באינדקס' : ''}</span>
          ${u.skills.length ? `<div class="note" style="margin:2px 0 0">${esc(u.skills.map(s => ROLES[s] || s).join(' · '))}</div>` : ''}
        </span>
        ${u.id === S.uid ? '<span class="chip verified">זה את/ה</span>' : `<button class="btn ghost sm" data-a="admin-del-user" data-id="${esc(u.id)}">⛔ מחק</button>`}
      </div>`).join('')}

      <h3 class="section-title">🎭 פרויקטים (${S.projects.length})</h3>
      ${S.projects.length ? S.projects.map(p => `<div class="admin-row">
        <span>
          <b>${esc(p.title)}</b>
          <span class="note">· ${esc(p.creator)} · ${esc(p.format || MEDIA[p.medium || 'theater'])}${isOpen(p) ? '' : ' · סגור'}</span>
        </span>
        <span class="row">
          ${p.status !== 'filled' ? `<button class="btn ghost sm" data-a="admin-close-proj" data-id="${esc(p.id)}">סגור</button>` : ''}
          <button class="btn ghost sm" data-a="admin-del-proj" data-id="${esc(p.id)}">🗑️ מחק</button>
        </span>
      </div>`).join('') : '<div class="empty" style="padding:20px">אין פרויקטים עדיין</div>'}
    `;
  }

  if (S.tab === 'profile') {
    const u = S.user;
    const skills = skillsOf(u);
    const link = linkHtml(u.link, '🔗 ' + esc(u.link));
    return `<div class="list">
      <div class="card" style="padding:24px">
        <div class="row" style="justify-content:space-between;margin-bottom:12px">
          ${u.seeking ? '<span class="chip verified">✓ מחפש/ת עבודה – מופיע/ה באינדקס</span>' : '<span class="chip">לא מופיע/ה באינדקס אנשי המקצוע</span>'}
          <button class="btn ghost sm" data-a="edit-profile">✏️ ערוך פרופיל</button>
        </div>
        <h3 style="font-size:28px">${esc(u.name)}</h3>
        ${skills.length ? `<div class="need-tags">${skills.map(s => `<span class="role-tag">${esc(ROLES[s] || s)}</span>`).join('')}</div>` : ''}
        <p class="meta" style="margin:10px 0 14px">📍 ${esc(u.loc)}${u.region ? ` (${esc(u.region)})` : ''} · 🔒 טלפון לאישור: ${esc(u.phone || 'לא הוזן')}</p>
        ${u.studioOrGear ? `<p><b>מסגרת / ציוד וכלים:</b> ${esc(u.studioOrGear)}</p>` : ''}
        <p><b>ניסיון והפקות קודמות:</b> ${esc(u.past)}</p>
        ${link ? `<p>${link}</p>` : ''}
      </div>

      <div class="card" style="padding:20px">
        <h4 style="font-size:18px;margin-bottom:6px">🔑 החשבון שלך</h4>
        <p class="note" style="margin:0">כרגע החשבון שמור בדפדפן הזה בלבד. אם תנקה את הדפדפן או תיכנס ממכשיר אחר, תצטרך פרופיל חדש. בקרוב: כניסה עם גוגל, כדי שהחשבון יישמר בכל מקום.</p>
      </div>

      <div class="card" style="padding:20px">
        <h4 style="font-size:18px;margin-bottom:6px">🛡️ בטיחות ופרטיות</h4>
        ${S.blocked.size ? `
          <p class="note" style="margin:0 0 6px">משתמשים שחסמת:</p>
          <div class="row" style="margin-bottom:12px">
            ${[...S.blocked].map(id => `<span class="chip">${esc(nameOf(id))} <button type="button" class="linklike" data-a="unblock" data-id="${esc(id)}">בטל חסימה</button></span>`).join('')}
          </div>
        ` : '<p class="note" style="margin:0 0 12px">לא חסמת אף אחד.</p>'}
        <div class="row">
          <button class="btn ghost sm" data-a="terms">📄 תנאי שימוש ופרטיות</button>
          <button class="btn ghost sm" data-a="delete-account">🗑️ מחק את החשבון שלי</button>
        </div>
      </div>
    </div>`;
  }
}

function modalView() {
  const m = S.modal;
  if (!m) return '';
  let h = '';

  if (m === 'proj') {
    const editing = S.editProjId ? S.projects.find(x => x.id == S.editProjId) : null;
    const medium = editing ? (editing.medium || 'theater') : 'theater';
    const sel = editing ? projRoles(editing) : [];
    h = `<h3>${editing ? 'עריכת פרויקט קיים' : 'פרסום פרויקט חדש'}</h3>
      <p class="note">מלא את פרטי ההפקה כדי ששחקנים ואנשי מקצוע מתאימים יוכלו להגיש מועמדות.</p>
      <form data-f="proj">
        <label>שם ההפקה, המחזה או הסרט *</label>
        <input name="title" required maxlength="120" value="${esc(editing ? editing.title : '')}" placeholder="למשל: העלמה והמוות / סרט גמר">

        <div class="grid2">
          <div>
            <label>סוג הפרויקט *</label>
            <select name="medium">${opts(MEDIA, medium)}</select>
          </div>
          <div>
            <label>פורמט</label>
            <select name="format">${opts(FORMATS[medium], editing ? editing.format : undefined)}</select>
          </div>
        </div>

        <div class="grid2">
          <div>
            <label>שלב ההפקה הנוכחי *</label>
            <select name="stage">${opts(STAGES[medium], editing ? editing.stage : undefined)}</select>
          </div>
          <div>
            <label>מסגרת הפקה ותקציב *</label>
            <select name="frame">${opts(FRAMES, editing ? editing.frame : undefined)}</select>
          </div>
        </div>

        <label>את מי אתם מחפשים? (אפשר לסמן כמה) *</label>
        <div class="role-picker" id="role-picker">${pills(MEDIA_ROLES[medium], sel)}</div>

        <div class="grid2">
          <div>
            <label>עיר / מיקום *</label>
            <input name="loc" required maxlength="80" value="${esc(editing ? editing.loc : (S.user?.loc || ''))}" placeholder="למשל: ירושלים, תיאטרון החאן">
          </div>
          <div>
            <label>אזור *</label>
            <select name="region" required>
              <option value="">בחר/י אזור</option>
              ${opts(REGIONS, editing ? editing.region : (S.user?.region || undefined))}
            </select>
          </div>
        </div>

        <div class="grid2">
          <div>
            <label>תאריכים / חלון זמן</label>
            <input name="dates" maxlength="80" value="${esc(editing ? editing.dates : '')}" placeholder="למשל: נובמבר–דצמבר 2026">
          </div>
          <div>
            <label>הגשת מועמדות עד (רשות)</label>
            <input name="deadline" type="date" min="${todayISO()}" value="${esc(editing && editing.deadline ? editing.deadline : '')}">
          </div>
        </div>

        <label>תיאור הפרויקט והאווירה האמנותית *</label>
        <textarea name="desc" rows="3" required maxlength="3000" placeholder="ספר בקצרה על המחזה או הסרט, סגנון העבודה ומה אתם מחפשים...">${esc(editing ? editing.desc : '')}</textarea>

        <label>מפרט טכני / דגשים לאולם או ללוקיישן (רשות)</label>
        <input name="tech" maxlength="500" value="${esc(editing ? editing.tech : '')}" placeholder="למשל: grandMA dot2 באולם / צילומי לילה בחוץ...">

        <div class="row" style="margin-top:16px">
          <button class="btn">${editing ? 'שמור שינויים' : 'פרסם פרויקט בלוח'}</button>
          <button type="button" class="btn ghost" data-a="close">ביטול</button>
        </div>
      </form>`;
  } else if (m === 'apply') {
    const p = S.projects.find(x => x.id == S.applyProjId);
    const rolesArr = p ? projRoles(p) : [];
    const mySkill = rolesArr.find(r => skillsOf(S.user).includes(r));
    h = `<h3>הגשת מועמדות: ${esc(p ? p.title : '')}</h3>
      <p class="note">היוצר יקבל את הפרופיל שלך (${esc(S.user.name)}), הניסיון והקישור שלך. מספר הטלפון שלך ייחשף רק אם המועמדות תאושר.</p>
      <form data-f="apply">
        <label>לאיזה תפקיד אתה פונה?</label>
        <select name="role">${rolesArr.map(r => `<option value="${esc(r)}"${r === mySkill ? ' selected' : ''}>${esc(ROLES[r] || r)}</option>`).join('')}</select>
        <label>הודעה קצרה ליוצר *</label>
        <textarea name="note" rows="3" required maxlength="1000" placeholder="היי! ראיתי את הפרויקט שלכם, אני זמין בתאריכים האלו ויש לי ניסיון מתאים..."></textarea>
        <div class="row" style="margin-top:16px">
          <button class="btn">שלח מועמדות לאישור</button>
          <button type="button" class="btn ghost" data-a="close">ביטול</button>
        </div>
      </form>`;
  } else if (m === 'chat') {
    const c = S.chat;
    const proj = c.projId ? S.projects.find(p => String(p.id) === String(c.projId)) : null;
    const other = S.profiles[c.otherId] || {};
    const ms = threadMessages(c.otherId, c.projId);
    h = `<div class="row" style="justify-content:space-between">
        <div>
          <h3 style="margin:0">${esc(other.name || 'משתמש/ת')}</h3>
          <div style="color:var(--gold);font-weight:700;font-size:13px">${esc(proj ? proj.title : skillsOf(other).map(s => ROLES[s] || s).join(' · '))}</div>
        </div>
        <div class="row">
          <button class="btn ghost sm" data-a="report" data-other="${esc(c.otherId)}" data-proj="${esc(c.projId || '')}">🚩 דווח / חסום</button>
          <button class="btn ghost sm" data-a="close" aria-label="סגור">✕</button>
        </div>
      </div>
      <div class="msgs" id="msgs">
        ${ms.length ? ms.map(x => `<div class="m ${x.sender_id === S.uid ? 'me' : ''}">
            <div class="m-meta">${esc(nameOf(x.sender_id))} · ${esc(timeLabel(x.created_at))}</div>
            <div>${esc(x.body)}</div>
          </div>`).join('') : '<div class="note" style="text-align:center;margin:auto">עדיין אין הודעות בשיחה זו. רק שניכם רואים אותה.</div>'}
      </div>
      <form data-f="chat" class="row" style="flex-wrap:nowrap">
        <input name="msg" autocomplete="off" maxlength="1000" placeholder="כתוב הודעה...">
        <button class="btn">שלח</button>
      </form>`;
  } else if (m === 'report') {
    const name = nameOf(S.report.userId);
    h = `<h3>🚩 דיווח</h3>
      <p class="note">הדיווח מגיע רק למנהל האתר. ${esc(name)} לא יידע/תדע שדיווחת.</p>
      <form data-f="report">
        <label>מה הבעיה? *</label>
        <select name="reason" required>${opts(REPORT_REASONS)}</select>
        <label>פרטים (רשות)</label>
        <textarea name="details" rows="3" maxlength="1000" placeholder="ספר/י בקצרה מה קרה..."></textarea>
        <label class="check">
          <input type="checkbox" name="block">
          <span><b>חסום/חסמי את ${esc(name)}</b> – לא תראה/י יותר את המודעות וההודעות שלו/ה, והוא/היא לא יוכל/תוכל לפנות אליך.</span>
        </label>
        <div class="row" style="margin-top:16px">
          <button class="btn">שלח דיווח</button>
          <button type="button" class="btn ghost" data-a="close">ביטול</button>
        </div>
      </form>`;
  } else if (m === 'terms') {
    h = termsHtml() + `<div class="row" style="margin-top:16px"><button class="btn" data-a="close">הבנתי</button></div>`;
  } else if (m === 'confirm') {
    h = `<h3>רגע, בטוח?</h3>
      <p>${esc(S.confirm.text)}</p>
      <div class="row" style="margin-top:16px">
        <button class="btn" data-a="confirm-yes">כן, מחק</button>
        <button class="btn ghost" data-a="close">ביטול</button>
      </div>`;
  }

  return `<div class="ov" data-a="ovl"><div class="dlg" role="dialog" aria-modal="true">${h}</div></div>`;
}

function render() {
  if (!S.ready || S.error) {
    $('#main').innerHTML = statusScreen();
  } else if (!S.user || S.onboardingType === 'edit') {
    $('#main').innerHTML = S.onboardingType ? onboarding() : welcome();
  } else {
    $('#main').innerHTML = mainView();
  }
  renderModal();
}

function renderModal() {
  $('#modal').innerHTML = modalView();
  const m = $('#msgs');
  if (m) m.scrollTop = m.scrollHeight;
}

function closeModal() {
  S.modal = null;
  S.chat = null;
  S.editProjId = null;
  S.confirm = null;
  S.report = null;
  renderModal();
}

// ───────────── Events ─────────────

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const a = el.dataset.a, id = el.dataset.id;

  if (a === 'ovl' && e.target !== el) return;
  if (a === 'reload') {
    location.reload();
  } else if (a === 'theme') {
    S.theme = S.theme === 'dark' ? 'light' : 'dark';
    save('kb_theme', S.theme);
    applyTheme();
    render();
  } else if (a === 'start-onboard') {
    S.onboardingType = id;
    render();
  } else if (a === 'back-welcome') {
    S.onboardingType = null;
    render();
  } else if (a === 'edit-profile') {
    S.onboardingType = 'edit';
    render();
    window.scrollTo(0, 0);
  } else if (a === 'cancel-edit') {
    S.onboardingType = null;
    render();
  } else if (a === 'tab') {
    S.tab = id;
    render();
    if (id === 'admin') { await adminLoad(); render(); }
  } else if (a === 'admin-toggle-handled') {
    S.admin.showHandled = !S.admin.showHandled;
    render();
  } else if (a === 'report-handled') {
    const r = S.admin.reports.find(x => x.id == id);
    if (!r) return;
    el.disabled = true;
    await db(sb.from('reports').update({ handled: !r.handled }).eq('id', r.id));
    await adminLoad();
    render();
  } else if (a === 'admin-close-proj') {
    el.disabled = true;
    const ok = await db(sb.from('projects').update({ status: 'filled' }).eq('id', id));
    await loadAll(); await adminLoad();
    render();
    if (ok) toast('הפרויקט נסגר');
  } else if (a === 'admin-del-proj') {
    const p = S.projects.find(x => x.id == id);
    S.confirm = { a: 'admin-del-proj', id, text: `למחוק את הפרויקט "${p ? p.title : ''}"? גם המועמדויות וההודעות שלו יימחקו.` };
    S.modal = 'confirm';
    renderModal();
  } else if (a === 'admin-del-user') {
    S.confirm = { a: 'admin-del-user', id, text: `למחוק את המשתמש "${nameOf(id)}"? הפרופיל, הטלפון, הפרויקטים, המועמדויות וההודעות שלו יימחקו לצמיתות.` };
    S.modal = 'confirm';
    renderModal();
  } else if (a === 'unfocus') {
    history.replaceState(null, '', location.pathname + location.search);
    S.focusId = null;
    render();
  } else if (a === 'open') {
    S.editProjId = null;
    S.modal = id;
    renderModal();
  } else if (a === 'edit-proj') {
    const p = S.projects.find(x => x.id == id);
    if (!p || !isMine(p)) return;
    S.editProjId = p.id;
    S.modal = 'proj';
    renderModal();
  } else if (a === 'share-wa') {
    const p = S.projects.find(x => x.id == id);
    if (!p) return;
    const rolesArr = projRoles(p).map(r => ROLES[r] || r).join(', ');
    const url = location.origin + location.pathname + '#p=' + p.id;
    const kind = p.format || MEDIA[p.medium || 'theater'];
    const shareText = `🎭 *קול קורא: ${p.title}* (${kind})\n📍 מיקום: ${p.loc} · ${p.frame}\n💡 מחפשים: ${rolesArr}\n📝 ${p.desc}\n\nלהגשת מועמדות דרך *קול במה*:\n${url}`;
    window.open('https://wa.me/?text=' + encodeURIComponent(shareText), '_blank');
  } else if (a === 'toggle-role') {
    const on = el.classList.toggle('active');
    el.setAttribute('aria-pressed', on);
  } else if (a === 'terms') {
    e.preventDefault();
    S.modal = 'terms';
    renderModal();
  } else if (a === 'report') {
    const userId = el.dataset.other;
    if (!userId || userId === S.uid) return;
    S.chat = null;
    S.report = { userId, projectId: el.dataset.proj || null };
    S.modal = 'report';
    renderModal();
  } else if (a === 'unblock') {
    el.disabled = true;
    const ok = await db(sb.from('blocks').delete().eq('blocked_id', id));
    await loadAll();
    render();
    if (ok) toast('החסימה בוטלה');
  } else if (a === 'delete-account') {
    S.confirm = { a: 'delete-account', text: 'כל המידע שלך יימחק לצמיתות: הפרופיל, הטלפון, הפרויקטים, המועמדויות וההודעות. אי אפשר לבטל את זה.' };
    S.modal = 'confirm';
    renderModal();
  } else if (a === 'toggle-filled') {
    const p = S.projects.find(x => x.id == id);
    if (!p || !isMine(p)) return;
    el.disabled = true;
    const filled = p.status !== 'filled';
    const ok = await db(sb.from('projects').update({ status: filled ? 'filled' : 'open' }).eq('id', p.id));
    await loadAll();
    render();
    if (ok) toast(filled ? 'מזל טוב! המודעה סומנה כסגורה.' : 'המודעה נפתחה מחדש');
  } else if (a === 'apply-open') {
    if (hasApplied(id)) { toast('כבר הגשת מועמדות לפרויקט הזה'); return; }
    const p = S.projects.find(x => x.id == id);
    if (!p || !isOpen(p)) { toast('ההגשה לפרויקט הזה נסגרה'); return; }
    S.applyProjId = id;
    S.modal = 'apply';
    renderModal();
  } else if (a === 'app-approve' || a === 'app-decline') {
    const app = S.apps.find(x => x.id == id);
    if (!app || app.ownerUid !== S.uid) return;
    el.disabled = true;
    const approve = a === 'app-approve';
    const ok = await db(sb.from('applications').update({ status: approve ? 'approved' : 'declined' }).eq('id', app.id));
    if (ok && approve) {
      await db(sb.from('messages').insert({
        project_id: app.projId,
        recipient_id: app.applicantUid,
        body: `✅ המועמדות שלך לתפקיד ${ROLES[app.role] || app.role} ב״${app.projTitle}״ אושרה! אפשר לתאם כאן או בוואטסאפ.`
      }));
    }
    await loadAll();
    render();
    if (ok) toast(approve ? 'המועמד אושר. הטלפון שלו גלוי לך עכשיו.' : 'הפנייה נדחתה');
  } else if (a === 'close' || a === 'ovl') {
    closeModal();
  } else if (a === 'chat') {
    const otherId = el.dataset.other;
    if (!otherId || otherId === S.uid) return;
    S.chat = { otherId, projId: el.dataset.proj || null };
    S.modal = 'chat';
    renderModal();
    const i = $('#modal input[name="msg"]');
    if (i) i.focus();
  } else if (a === 'del') {
    const p = S.projects.find(x => x.id == id);
    if (!p || !isMine(p)) return;
    S.confirm = { a: 'del', id: p.id, text: `למחוק את "${p.title}"? גם המועמדויות וההודעות של הפרויקט יימחקו.` };
    S.modal = 'confirm';
    renderModal();
  } else if (a === 'confirm-yes') {
    const c = S.confirm;
    el.disabled = true;
    if (c && c.a === 'delete-account') {
      const ok = await db(sb.rpc('delete_my_account'), 'המחיקה נכשלה. נסה שוב.');
      if (!ok) { el.disabled = false; return; }
      await sb.auth.signOut().catch(() => {});
      // Forget this browser's account and any old local data, so nothing is re-imported
      Object.keys(localStorage).filter(k => k !== 'kb_theme').forEach(k => localStorage.removeItem(k));
      location.replace(location.pathname);
      return;
    }
    if (c && (c.a === 'admin-del-user' || c.a === 'admin-del-proj')) {
      const ok = c.a === 'admin-del-user'
        ? await db(sb.rpc('admin_delete_user', { target: c.id }), 'המחיקה נכשלה')
        : await db(sb.from('projects').delete().eq('id', c.id), 'המחיקה נכשלה');
      await loadAll(); await adminLoad();
      closeModal();
      render();
      if (ok) toast(c.a === 'admin-del-user' ? 'המשתמש נמחק' : 'הפרויקט נמחק');
      return;
    }
    if (c && c.a === 'del') {
      const ok = await db(sb.from('projects').delete().eq('id', c.id));
      if (ok) toast('הפרויקט נמחק');
      await loadAll();
    }
    closeModal();
    render();
  }
});

// Switching theater/film in the project form swaps formats, stages and roles
document.addEventListener('change', e => {
  const f = e.target.form;
  if (!f || f.dataset.f !== 'proj' || e.target.name !== 'medium') return;
  const m = e.target.value;
  f.elements.format.innerHTML = opts(FORMATS[m]);
  f.elements.stage.innerHTML = opts(STAGES[m]);
  $('#role-picker').innerHTML = pills(MEDIA_ROLES[m], picked(f));
});

document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.k;
  if (!k) return;
  S[k] = e.target.value;
  const l = $('#list');
  if (l) l.innerHTML = renderTabContent();
});

document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, d = Object.fromEntries(new FormData(f)), t = f.dataset.f;

  if (t === 'onboard') {
    const skills = picked(f);
    const seeking = !!d.seeking;
    const link = safeUrl(d.link);
    if (seeking && !skills.length) { toast('כדי להופיע באינדקס, בחר/י לפחות תחום אחד'); return; }
    if (d.link.trim() && !link) { toast('הקישור לא תקין. הדבק כתובת שמתחילה ב־https://'); return; }
    const wasEdit = S.onboardingType === 'edit';
    setBusy(f, true);
    const ok = await db(sb.from('profiles').upsert({
      id: S.uid,
      name: d.name.trim(),
      loc: d.loc.trim(),
      region: d.region,
      skills,
      seeking,
      studio_or_gear: (d.studioOrGear || '').trim(),
      past: d.past.trim(),
      link,
      updated_at: new Date().toISOString(),
      ...(d.terms ? { terms_accepted_at: new Date().toISOString() } : {})
    })) && await db(sb.from('private_contacts').upsert({ user_id: S.uid, phone: (d.phone || '').trim() }));
    if (!ok) { setBusy(f, false); return; }
    const imported = wasEdit ? 0 : await importLegacyProjects();
    await loadAll();
    S.onboardingType = null;
    if (!wasEdit) S.tab = 'board';
    render();
    toast(wasEdit ? 'הפרופיל עודכן'
      : imported ? `ברוך הבא! ${imported} פרויקטים שפרסמת בעבר הועלו ללוח.` : 'ברוך הבא ל״קול במה״!');
  } else if (t === 'proj') {
    const roles = picked(f);
    if (!roles.length) { toast('סמן/י לפחות תפקיד אחד שאתם מחפשים'); return; }
    const row = {
      title: d.title.trim(),
      medium: d.medium,
      format: d.format || '',
      roles,
      stage: d.stage,
      frame: d.frame,
      loc: d.loc.trim(),
      region: d.region,
      dates: d.dates.trim() || 'בקרוב',
      deadline: d.deadline || null,
      description: d.desc.trim(),
      tech: (d.tech || '').trim()
    };
    const editId = S.editProjId;
    setBusy(f, true);
    const ok = await db(editId
      ? sb.from('projects').update(row).eq('id', editId)
      : sb.from('projects').insert(row));
    if (!ok) { setBusy(f, false); return; }
    await loadAll();
    S.modal = null;
    S.editProjId = null;
    S.tab = 'board';
    render();
    toast(editId ? 'השינויים נשמרו' : 'הפרויקט פורסם בלוח');
  } else if (t === 'apply') {
    const proj = S.projects.find(x => x.id == S.applyProjId);
    if (!proj || hasApplied(proj.id)) { closeModal(); return; }
    setBusy(f, true);
    const { error } = await sb.from('applications').insert({ project_id: proj.id, role: d.role, note: d.note.trim() });
    if (error) {
      setBusy(f, false);
      toast(error.code === '23505' ? 'כבר הגשת מועמדות לפרויקט הזה' : 'משהו השתבש. נסה שוב.');
      return;
    }
    await loadAll();
    S.modal = null;
    S.tab = 'apps';
    render();
    toast('המועמדות נשלחה');
  } else if (t === 'report') {
    const r = S.report;
    setBusy(f, true);
    const ok = await db(sb.from('reports').insert({
      reported_user_id: r.userId,
      project_id: r.projectId ? Number(r.projectId) : null,
      reason: d.reason,
      details: (d.details || '').trim()
    }), 'הדיווח לא נשלח. נסה שוב.');
    if (!ok) { setBusy(f, false); return; }
    if (d.block) await db(sb.from('blocks').insert({ blocked_id: r.userId }));
    await loadAll();
    closeModal();
    render();
    toast(d.block ? 'תודה. הדיווח התקבל והמשתמש נחסם.' : 'תודה, הדיווח התקבל.');
  } else if (t === 'chat') {
    const txt = (d.msg || '').trim();
    if (!txt) return;
    setBusy(f, true);
    const ok = await db(sb.from('messages').insert({
      recipient_id: S.chat.otherId,
      project_id: S.chat.projId || null,
      body: txt
    }), 'ההודעה לא נשלחה. נסה שוב.');
    if (ok) await loadAll();
    renderModal();
    const i = $('#modal input[name="msg"]');
    if (i) { if (!ok) i.value = txt; i.focus(); }
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.modal) closeModal();
});

boot();
</script>
</body>
</html>
