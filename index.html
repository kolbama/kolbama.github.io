        </span>
      </div>`).join('') : '<div class="empty" style="padding:20px">אין פרויקטים עדיין</div>'}
    `;
  }

  if (S.tab === 'profile') {
    const u = S.user;
    const skills = skillsOf(u);
    const link = linkHtml(u.link, ic('link') + ' ' + esc(u.link));
    return `<div class="list">
      <div class="card m-person" style="padding:24px">
        <div class="row" style="justify-content:space-between;margin-bottom:16px">
          ${u.seeking ? `<span class="chip verified">${ic('check')} מחפש/ת עבודה – מופיע/ה באינדקס</span>` : '<span class="chip">לא מופיע/ה באינדקס אנשי המקצוע</span>'}
          <button class="btn ghost sm" data-a="edit-profile">${ic('pencil')} עריכת הפרופיל</button>
        </div>
        <div class="who">${avatar(u.name, 72, u.photo)}<h3 style="font-size:1.875rem;margin:0">${esc(u.name)}</h3></div>
        <div class="row photo-row">
          <label class="btn ghost sm photo-pick">${ic('camera')} ${u.photo ? 'החלפת התמונה' : 'הוספת תמונת פרופיל'}
            <input type="file" accept="image/*" data-photo class="vh">
          </label>
          ${u.photo ? `<button type="button" class="btn ghost sm" data-a="photo-remove">${ic('trash-2')} הסרת התמונה</button>` : ''}        </div>
        ${skills.length ? `<div class="need-tags">${skills.map(s => `<span class="role-tag">${esc(ROLES[s] || s)}</span>`).join('')}</div>` : ''}
        <p class="meta" style="margin:10px 0 14px">${ic('map-pin')} ${esc(u.loc)}${u.region ? ` (${esc(u.region)})` : ''} · ${ic('lock')} טלפון לאישור: ${esc(u.phone || 'לא הוזן')}</p>
        ${u.studioOrGear ? `<p><b>מסגרת / ציוד וכלים:</b> ${esc(u.studioOrGear)}</p>` : ''}
        ${u.past ? `<p><b>ניסיון והפקות קודמות:</b> ${esc(u.past)}</p>` : ''}
        ${link ? `<p>${link}</p>` : ''}
      </div>

      <div class="card" style="padding:20px">
        <h4 style="font-size:1.125rem;margin-bottom:6px">${ic('key-round')} החשבון שלך</h4>
        ${S.isGuest ? `
          <p class="note" style="margin:0 0 10px">החשבון שמור כרגע רק בדפדפן הזה. חבר/י אותו לגוגל, ואז אפשר להיכנס מכל מכשיר.</p>
          ${googleBtn('חיבור לגוגל', 'btn sm')}
        ` : `
          <p class="note" style="margin:0 0 10px">${ic('circle-check')} מחובר/ת עם חשבון גוגל. אפשר להיכנס מכל מכשיר.</p>
          <button class="btn ghost sm" data-a="logout">יציאה מהחשבון</button>
        `}
      </div>

      ${pushCard()}
      ${installCard()}
      ${inviteCard()}

      <div class="card" style="padding:20px">
        <h4 style="font-size:1.125rem;margin-bottom:6px">${ic('shield-check')} בטיחות ופרטיות</h4>
        ${S.blocked.size ? `
          <p class="note" style="margin:0 0 6px">משתמשים שחסמת:</p>
          <div class="row" style="margin-bottom:12px">
            ${[...S.blocked].map(id => `<span class="chip">${esc(nameOf(id))} <button type="button" class="linklike" data-a="unblock" data-id="${esc(id)}">בטל חסימה</button></span>`).join('')}
          </div>
        ` : '<p class="note" style="margin:0 0 12px">לא חסמת אף אחד.</p>'}
        <div class="row">
          <button class="btn ghost sm" data-a="terms">${ic('file-text')} תנאי שימוש ופרטיות</button>
          <button class="btn ghost sm" data-a="delete-account">${ic('trash-2')} מחק את החשבון שלי</button>
        </div>
      </div>
    </div>`;
  }
}

function modalView() {
  const m = S.modal;
  if (!m) return '';
  let h = '';

  if (m === 'proj') {
    const editing = S.editProjId ? S.projects.find(x => x.id == S.editProjId) : null;
    const medium = editing ? (editing.medium || 'theater') : 'theater';
    const sel = editing ? projRoles(editing) : [];
    // A new project is 3 short steps (like signup); editing shows everything on one page (step 0)
    const step = editing ? 0 : (S.projStep || 1);
    const hide = n => step && step !== n ? ' hidden' : '';
    const nav = n => step ? `<div class="row ob-nav">
        ${n > 1 ? `<button type="button" class="btn ghost" data-a="proj-prev">→ הקודם</button>` : ''}
        ${n < 3 ? `<button type="button" class="btn" data-a="proj-next">הבא ←</button>` : ''}
      </div>` : '';
    h = `<h3>${editing ? 'עריכת פרויקט קיים' : 'פרסום פרויקט חדש'}</h3>
      ${step ? '' : '<p class="note">מלא את פרטי ההפקה כדי ששחקנים ואנשי מקצוע מתאימים יוכלו להגיש מועמדות.</p>'}

        ${step ? projProgress(step) : ''}
        <div class="ob-step" data-step="1"${hide(1)}>
        <div class="fs-title"><span>1</span>הפרויקט</div>
        <label>שם ההפקה, המחזה או הסרט *</label>
        <input name="title" required maxlength="120" value="${esc(editing ? editing.title : '')}">

        <label>תיאטרון או קולנוע? *</label>
        <div class="medium-pick">
          ${Object.entries(MEDIA).map(([k, v]) => `<label class="medium-card"><input type="radio" name="medium" value="${k}"${k === medium ? ' checked' : ''}>

        </div>

        <div class="grid2">
          <div>
            <label>מה סוג ההפקה?</label>
            <select name="format">${opts(FORMATS[medium], editing ? editing.format : undefined)}</select>
          </div>
          <div>
            <label>איפה אתם עומדים? *</label>
            <select name="stage">${opts(STAGES[medium], editing ? editing.stage : undefined)}</select>

        </div>
        ${nav(1)}
        </div>

        <div class="ob-step" data-step="2"${hide(2)}>

        <div class="role-picker" id="role-picker">${pills(MEDIA_ROLES[medium], sel)}</div>

        <label>מסגרת הפקה ותקציב *</label>

        ${nav(2)}
        </div>

        <div class="ob-step" data-step="3"${hide(3)}>
        <div class="fs-title"><span>3</span>איפה, מתי ועל מה</div>
        <div class="grid2">
          <div>
            <label>עיר / מיקום *</label>
            <input name="loc" required maxlength="80" value="${esc(editing ? editing.loc : (S.user?.loc || ''))}" placeholder="למשל: ירושלים, תיאטרון החאן">
          </div>
          <div>
            <label>אזור *</label>
            <select name="region" required>
              <option value="">בחר/י אזור</option>
              ${opts(REGIONS, editing ? editing.region : (S.user?.region || undefined))}

          </div>
        </div>

        <div class="grid2">
          <div>
            <label>תאריכים / חלון זמן</label>
            <input name="dates" maxlength="80" value="${esc(editing ? editing.dates : '')}" placeholder="למשל: נובמבר–דצמבר 2026">

          <div>
            <label>הגשת מועמדות עד (רשות)</label>
            <input name="deadline" type="date" min="${todayISO()}" value="${esc(editing && editing.deadline ? editing.deadline : '')}">
          </div>
        </div>

        <label>תיאור הפרויקט והאווירה האמנותית *</label>

          ${step ? '' : `<button type="button" class="btn ghost" data-a="close">ביטול</button>`}
        </div>
        </div>
      </form>`;
  } else if (m === 'apply') {
    const p = S.projects.find(x => x.id == S.applyProjId);

    const mySkill = rolesArr.find(r => skillsOf(S.user).includes(r));
    h = `<h3>הגשת מועמדות: ${esc(p ? p.title : '')}</h3>
      <p class="note">היוצר יקבל את הפרופיל שלך (${esc(S.user.name)}), הניסיון והקישור שלך. מספר הטלפון שלך ייחשף רק אם המועמדות תאושר.</p>

        <label>לאיזה תפקיד הפנייה?</label>

        <label>הודעה קצרה ליוצר *</label>
        <textarea name="note" rows="3" required maxlength="1000" placeholder="היי! ראיתי את הפרויקט שלכם, אני זמין בתאריכים האלו ויש לי ניסיון מתאים…"></textarea>

    const other = S.profiles[c.otherId] || {};
    const ms = threadMessages(c.otherId, c.projId);
    h = `<div class="row" style="justify-content:space-between">
        <div class="who">
          ${avatar(other.name, 44, other.avatar_url)}

            <h3 style="margin:0">${esc(other.name || 'משתמש/ת')}</h3>
            <div style="color:var(--gold);font-weight:700;font-size:0.8125rem">${esc(proj ? proj.title : skillsOf(other).map(s => ROLES[s] || s).join(' · '))}</div>

      </div>
      <form data-f="chat" class="row" style="flex-wrap:nowrap">
        <input name="msg" autocomplete="off" maxlength="1000" placeholder="כתיבת הודעה…">
        <button class="btn">שליחה</button>
      </form>`;
  } else if (m === 'report') {

        <div class="row" style="margin-top:16px">

      : `<h3>${ic('bell')} רוצה לדעת כשיענו לך?</h3>
      <p>נשלח לך התראה לטלפון כשמישהו עונה להודעה, מגיש מועמדות לפרויקט שלך או עונה למועמדות שלך. אפשר לכבות בכל רגע בפרופיל.</p>`;

const NUDGE_KEY = 'kb_photo_nudge';
function nudgeSeen() {

// Offer to turn on phone notifications, once per account on this device, right after a first
// message / application / published project. The window waits if another window is open.
const PUSH_OFFER_KEY = 'kb_push_offer';
// Two separate one-time offers per account on this device: a few seconds after entering ('entry'),
// and after the first action ('action'), each with its own key.
// The 'entry' window comes back up to 3 times (at least 3 days apart) for people who still have notifications off.
const PUSH_ENTRY_KEY = 'kb_push_entry2';
function entryInfo() {
  try { return JSON.parse(localStorage.getItem(PUSH_ENTRY_KEY) || '{}')[S.uid] || [0, 0]; } catch (e) { return [0, 0]; }
}
function markEntryShown() {
  try {
    const o = JSON.parse(localStorage.getItem(PUSH_ENTRY_KEY) || '{}');
    o[S.uid] = [(o[S.uid] || [0])[0] + 1, Date.now()];
    localStorage.setItem(PUSH_ENTRY_KEY, JSON.stringify(o));
  } catch (e) {}
}
function pushOfferSeen(kind = 'action') {
  if (S['pushOffered_' + kind]) return true;
  if (kind === 'entry') { const [n, t] = entryInfo(); return n >= 3 || (n > 0 && Date.now() - t < 3 * 864e5); }
  try { return JSON.parse(localStorage.getItem(PUSH_OFFER_KEY) || '[]').includes(S.uid); } catch (e) { return false; }
}
function pushOfferWanted(kind = 'action') {
  if (pushOfferSeen(kind) || pushState() !== 'off') return;
  S.pushOfferReady = kind;
}
function maybePushOffer() {
  if (!S.pushOfferReady || !S.user || S.modal || S.onboardingType) return;
  const kind = S.pushOfferReady;
  S.pushOfferReady = false;
  if (pushOfferSeen(kind) || pushState() !== 'off') return;
  S['pushOffered_' + kind] = true;
  if (kind === 'entry') markEntryShown();
  else try {
    const seen = JSON.parse(localStorage.getItem(PUSH_OFFER_KEY) || '[]');
    if (!seen.includes(S.uid)) localStorage.setItem(PUSH_OFFER_KEY, JSON.stringify([...seen, S.uid].slice(-20)));
  } catch (e) {}

}
// A few seconds after entering, once per session: ask people with notifications off (once per account).
function schedulePushEntryOffer() {
  if (S.pushEntryTimer || !S.user) return;
  S.pushEntryTimer = setTimeout(() => {

}

function render() {

function renderModal() {
  const opening = !!S.modal && !modalInHistory;
  const closing = !S.modal && modalInHistory;
  if (opening) S.modalOpener = document.activeElement;
  $('#modal').innerHTML = modalView();
  const m = $('#msgs');
  if (m) m.scrollTop = m.scrollHeight;
  fitChat();
  // Remember the untouched form, so we can tell later whether the person typed anything
  const f = FORM_MODALS.includes(S.modal) ? $('.dlg form[data-f]') : null;
  S.snap = f ? formSnap(f) : null;
  linkLabels($('#modal'));
  if (S.modal === 'chat' && S.chat) markThreadRead(S.chat.otherId, S.chat.projId);
  // Screen readers: the window is named by its title, and the reader starts there.
  // (The title gets focus, not the first field, so phones don't pop up the keyboard by surprise.)
  const dlg = $('.dlg');
  const title = dlg && dlg.querySelector('h3');
  if (title) {
    title.id = title.id || 'dlg-title';
    title.tabIndex = -1;
    dlg.setAttribute('aria-labelledby', title.id);
    if (opening) title.focus({ preventScroll: true });
  }

  syncModalHistory();
}

// Full-page chat on a phone: keep it exactly inside the part of the screen above the keyboard.
// (iPhone does not shrink the page when the keyboard opens; it slides the page up instead.)
function fitChat() {
  const ov = document.querySelector('.ov.chat-ov');
  const v = window.visualViewport;
  if (!ov || !v || !matchMedia('(max-width: 760px)').matches) return;
  ov.style.top = v.offsetTop + 'px';
  ov.style.height = v.height + 'px';
  ov.style.bottom = 'auto';
  const m = document.getElementById('msgs');
  if (m) m.scrollTop = m.scrollHeight;
}
if (window.visualViewport) {
  visualViewport.addEventListener('resize', fitChat);
  visualViewport.addEventListener('scroll', fitChat);
}

// After a window closes, keyboard focus goes back to the button that opened it. If the screen was
// redrawn meanwhile, the same button (same action and id) is found again.
function restoreFocus() {
  const o = S.modalOpener;
  S.modalOpener = null;
  if (!o || o === document.body) return;
  const key = o.dataset && o.dataset.a ? { a: o.dataset.a, id: o.dataset.id } : null;
  const go = () => {
    let el = o.isConnected ? o : null;
    if (!el && key) el = [...document.querySelectorAll(`[data-a="${CSS.escape(key.a)}"]`)].find(x => x.dataset.id === key.id) || null;
    if (el) el.focus({ preventScroll: true });
  };
  go();
  setTimeout(go, 0); // once more, after any redraw that this close triggers
}

// Every visible label is tied to the field right after it, so tapping the label focuses the
// field and screen readers read the label with it. Text on screen does not change.
let labelSeq = 0;
function linkLabels(root) {
  if (!root) return;
  root.querySelectorAll('label:not([for])').forEach(lb => {
    if (lb.querySelector('input, select, textarea')) return; // the field is inside the label already
    const field = lb.nextElementSibling;
    if (!field || !field.matches('input, select, textarea')) return;
    if (!field.id) field.id = 'f' + (++labelSeq);
    lb.htmlFor = field.id;
  });
  root.querySelectorAll('input[required], select[required], textarea[required]').forEach(el => el.setAttribute('aria-required', 'true'));
}

// Closing a form dialog (tap outside, Escape, X, Cancel): if something was typed, ask first
function requestClose() {
  if (FORM_MODALS.includes(S.modal) && formDirty()) {
    if (!$('.discard')) {
      const d = document.createElement('div');
      d.className = 'discard';
      d.setAttribute('role', 'alert');

          <button type="button" class="btn ghost sm" data-a="discard">לסגור בלי לשמור</button>
        </div>`;

function closeModal() {

// ───────────── Back button (phone back, browser back, iPhone swipe) ─────────────
// Each screen change adds a step to the browser history, and an open window adds one more.
// "Back" closes the open window first (asking before throwing away typed text), then returns
// to the previous screen, and only then leaves the site. The address bar does not change.
const navState = () => ({ tab: S.tab, browsing: !!S.browsing, onboardingType: S.onboardingType || null, obStep: S.obStep || 1 });

}
// Called by renderModal(): keep one history step for "a window is open"
function syncModalHistory() {
  if (S.modal && !modalInHistory) {
    history.pushState({ kb: navState(), modal: true }, '');
    modalInHistory = true;
  } else if (!S.modal && modalInHistory) {
    modalInHistory = false;
    skipNextPop = true;
    history.back(); // the window was closed by a button, so remove its history step quietly
  }
}
window.addEventListener('popstate', e => {

    if (FORM_MODALS.includes(S.modal) && formDirty()) {
      // Typed text: stay, and ask first (same as tapping outside the window)
      history.pushState({ kb: navState(), modal: true }, '');
      modalInHistory = true;
      requestClose();
      return;
    }
    closeModal();
    return;
  }
  const st = e.state && e.state.kb;
  if (!st) return;
  S.tab = st.tab;
  S.browsing = st.browsing;
  S.onboardingType = st.onboardingType;
  S.obStep = st.obStep || 1;
  render();
  window.scrollTo(0, 0);
});

    await loadAll();
    render();
    if (ok) toast(approve ? 'המועמד אושר. הטלפון שלו גלוי לך עכשיו.' : 'הפנייה נדחתה');
  } else if (a === 'close' || a === 'ovl') {
    requestClose();
  } else if (a === 'chat') {
    const otherId = el.dataset.other;
    if (!otherId || otherId === S.uid) return;
    S.chat = { otherId, projId: el.dataset.proj || null };
    S.modal = 'chat';
    renderModal();
    // On a phone, don't pop the keyboard by itself: it pushed the whole chat up on iPhone
    const i = $('#modal input[name="msg"]');
    if (i && !matchMedia('(pointer: coarse)').matches) i.focus();
  } else if (a === 'del') {
    const p = S.projects.find(x => x.id == id);
    if (!p || !isMine(p)) return;
    S.confirm = { a: 'del', id: p.id, text: `למחוק את "${p.title}"? גם המועמדויות וההודעות של הפרויקט יימחקו.` };
    S.modal = 'confirm';
    renderModal();
  } else if (a === 'photo-remove') {
    el.disabled = true;
    const ok = await db(sb.from('profiles').update({ avatar_url: '' }).eq('id', S.uid), 'ההסרה נכשלה. אפשר לנסות שוב.');
    if (ok) await clearPhotos(S.uid).catch(() => {});
    await loadAll();
    render();
    if (ok) toast('התמונה הוסרה');
  } else if (a === 'confirm-yes') {
    const c = S.confirm;
    el.disabled = true;
    if (c && c.a === 'delete-account') {
      await clearPhotos(S.uid).catch(() => {}); // the photo files are not removed by the database itself
      const ok = await db(sb.rpc('delete_my_account'), 'המחיקה נכשלה. אפשר לנסות שוב.');
      if (!ok) { el.disabled = false; return; }
      await sb.auth.signOut().catch(() => {});
      // Forget this browser's account and any old local data, so nothing is re-imported
      Object.keys(localStorage).filter(k => k !== 'kb_theme').forEach(k => localStorage.removeItem(k));
      location.replace(location.pathname);
      return;
    }
    if (c && (c.a === 'admin-del-user' || c.a === 'admin-del-proj')) {
      if (c.a === 'admin-del-user') await clearPhotos(c.id).catch(() => {});
      const ok = c.a === 'admin-del-user'
        ? await db(sb.rpc('admin_delete_user', { target: c.id }), 'המחיקה נכשלה')
        : await db(sb.from('projects').delete().eq('id', c.id), 'המחיקה נכשלה');
      await loadAll(); await adminLoad();
      closeModal();
      render();
      if (ok) toast(c.a === 'admin-del-user' ? 'המשתמש נמחק' : 'הפרויקט נמחק');
      return;
    }
    if (c && c.a === 'del') {
      const ok = await db(sb.from('projects').delete().eq('id', c.id));
      if (ok) toast('הפרויקט נמחק');
      await loadAll();
    }
    closeModal();
    render();
  }
});

document.addEventListener('change', e => {

// Switching theater/film in the project form swaps formats, stages and roles
document.addEventListener('change', e => {
  const f = e.target.form;
  if (!f || f.dataset.f !== 'proj' || e.target.name !== 'medium') return;
  const m = e.target.value;
  f.elements.format.innerHTML = opts(FORMATS[m]);
  f.elements.stage.innerHTML = opts(STAGES[m]);
  $('#role-picker').innerHTML = pills(MEDIA_ROLES[m], picked(f));
});

document.addEventListener('change', e => {
  if (e.target.name === 'region' && e.target.closest('form')) e.target.dataset.manual = '1';
});
document.addEventListener('input', e => {
  if (e.target.name === 'loc' && e.target.form) {
    const sel = e.target.form.elements.region;
    const r = regionForCity(e.target.value);
    if (sel && r && !sel.dataset.manual) sel.value = r;
  }
  const k = e.target.dataset && e.target.dataset.k;
  if (!k) return;
  S[k] = e.target.value;
  const l = $('#list');
  if (l) { l.innerHTML = renderTabContent(); motionAfterList(); }
  const fb = $('.fbadge');

});

document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, d = Object.fromEntries(new FormData(f)), t = f.dataset.f;

  if (t === 'onboard') {
    // The form has novalidate (fields in hidden steps can't show the browser's bubble), so check step by step
    for (const st of f.querySelectorAll('.ob-step')) {
      const n = +st.dataset.step;
      const bad = [...st.querySelectorAll('input, select, textarea')].some(x => !x.checkValidity())
        || (n === 2 && f.elements.seeking.checked && !picked(f).length);
      if (bad) { if (st.hidden) goObStep(n); obStepValid(f, n); return; }
    }
    const skills = picked(f);
    const seeking = !!d.seeking;
    const link = safeUrl(d.link);
    if (d.link.trim() && !link) { toast('הקישור לא תקין. הדבק כתובת שמתחילה ב־https://'); return; }
    const wasEdit = S.onboardingType === 'edit';
    const needBirth = !!f.elements.birth;
    if (needBirth && !isAdultDate(d.birth)) {
      goObStep(1);
      toast('האתר מיועד לגילאי 18 ומעלה בלבד. בדקו את תאריך הלידה.');
      return;
    }
    setBusy(f, true);
    // The birth date goes first: the database refuses a new profile without an adult birth date
    if (needBirth) {
      const { error: be } = await sb.from('private_birth').insert({ user_id: S.uid, birth_date: d.birth });
      if (be && be.code !== '23505') { // 23505 = already saved on an earlier try
        console.error(be);
        toast(be.code === '23514' ? 'האתר מיועד לגילאי 18 ומעלה בלבד.' : 'משהו השתבש. אפשר לנסות שוב.');
        setBusy(f, false);
        return;
      }
    }
    const ok = await db(sb.from('profiles').upsert({
      id: S.uid,
      name: d.name.trim(),
      loc: d.loc.trim(),
      region: d.region,
      skills,
      seeking,
      ...('studioOrGear' in d ? { studio_or_gear: d.studioOrGear.trim() } : {}),
      past: d.past.trim(),
      link,
      updated_at: new Date().toISOString(),
      ...(d.terms ? { terms_accepted_at: new Date().toISOString() } : {})
    })) && ('phone' in d || !wasEdit ? await db(sb.from('private_contacts').upsert({ user_id: S.uid, phone: (d.phone || '').trim() })) : true);
    if (!ok) { setBusy(f, false); return; }
    if (S.obPhoto) {
      // A photo picked in the form; if it fails, the profile itself is still saved
      if (await savePhotoBlob(S.obPhoto.blob)) { URL.revokeObjectURL(S.obPhoto.url); S.obPhoto = null; }
    }
    const imported = wasEdit ? 0 : await importLegacyProjects();
    clearObDraft();
    S.obStep = 1;
    if (!wasEdit) markNudged(); // just saw the photo option in the form, no need for the "new: photos" window
    if (!wasEdit) S.justJoined = true; // offer "add to home screen" right away
    await loadAll();
    S.onboardingType = null;
    if (!wasEdit) S.tab = 'board';
    if (!wasEdit) S.modal = 'post-nudge';
    render();
    toast(wasEdit ? 'הפרופיל עודכן'
      : imported ? `ברוך הבא! ${imported} פרויקטים שפרסמת בעבר הועלו ללוח.` : 'ברוך הבא ל״קול במה״!');
  } else if (t === 'proj') {
    // novalidate (fields in hidden steps can't show the browser's bubble), so check step by step
    for (const st of f.querySelectorAll('.ob-step')) {
      const n = +st.dataset.step;
      const bad = [...st.querySelectorAll('input, select, textarea')].some(x => !x.checkValidity()) || (n === 2 && !picked(f).length);
      if (bad) { if (st.hidden) goProjStep(f, n); projStepValid(f, n); return; }
    }
    const roles = picked(f);
    const row = {
      title: d.title.trim(),
      medium: d.medium,
      format: d.format || '',
      roles,
      stage: d.stage,
      frame: d.frame,
      loc: d.loc.trim(),
      region: d.region,
      dates: d.dates.trim() || 'בקרוב',
      deadline: d.deadline || null,
      description: d.desc.trim(),
      tech: (d.tech || '').trim()
    };
    const editId = S.editProjId;
    setBusy(f, true);
    if (!(await savePhoneIfAsked(d))) { setBusy(f, false); return; }
    const ok = await db(editId
      ? sb.from('projects').update(row).eq('id', editId)
      : sb.from('projects').insert(row));
    if (!ok) { setBusy(f, false); return; }
    await loadAll();
    S.modal = null;
    S.editProjId = null;
    S.tab = 'board';
    if (!editId) pushOfferWanted();
    render();
    toast(editId ? 'השינויים נשמרו' : 'הפרויקט פורסם בלוח');
  } else if (t === 'apply') {
    const proj = S.projects.find(x => x.id == S.applyProjId);
    if (!proj || hasApplied(proj.id)) { closeModal(); return; }
    setBusy(f, true);
    if (!(await savePhoneIfAsked(d))) { setBusy(f, false); return; }
    const { error } = await sb.from('applications').insert({ project_id: proj.id, role: d.role, note: d.note.trim() });
    if (error) {
      setBusy(f, false);
      toast(error.code === '23505' ? 'כבר הגשת מועמדות לפרויקט הזה' : 'משהו השתבש. אפשר לנסות שוב.');
      return;
    }
    await loadAll();
    S.modal = null;
    S.tab = 'apps';
    pushOfferWanted();
    render();
    toast('המועמדות נשלחה');
  } else if (t === 'report') {
    const r = S.report;
    setBusy(f, true);
    const ok = await db(sb.from('reports').insert({
      reported_user_id: r.userId,
      project_id: r.projectId ? Number(r.projectId) : null,
      reason: d.reason,
      details: (d.details || '').trim()
    }), 'הדיווח לא נשלח. אפשר לנסות שוב.');
    if (!ok) { setBusy(f, false); return; }
    if (d.block) await db(sb.from('blocks').insert({ blocked_id: r.userId }));
    await loadAll();
    closeModal();
    render();
    toast(d.block ? 'תודה. הדיווח התקבל והמשתמש נחסם.' : 'תודה, הדיווח התקבל.');
  } else if (t === 'contact') {
    const message = (d.message || '').trim();
    if (!message) return;
    setBusy(f, true);
    const { error } = await sb.from('contact_requests').insert({
      topic: CONTACT_TOPICS[d.topic] ? d.topic : 'other',
      message,
      reply_to: (d.reply_to || '').trim()
    });
    if (error) {
      setBusy(f, false);
      toast(/too many/.test(error.message) ? 'נשלחו הרבה פניות בשעה האחרונה. אפשר לנסות שוב מאוחר יותר.' : 'הפנייה לא נשלחה. אפשר לנסות שוב.');
      return;
    }
    closeModal();
    toast('תודה! הפנייה נשלחה.');
  } else if (t === 'chat') {
    const txt = (d.msg || '').trim();
    if (!txt) return;
    setBusy(f, true);
    const ok = await db(sb.from('messages').insert({
      recipient_id: S.chat.otherId,
      project_id: S.chat.projId || null,
      body: txt
    }), 'ההודעה לא נשלחה. אפשר לנסות שוב.');
    if (ok) { await loadAll(); pushOfferWanted(); }
    renderModal();
    const i = $('#modal input[name="msg"]');
    if (i) { if (!ok) i.value = txt; i.focus(); }
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.modal) requestClose();
  // Keyboard users stay inside an open window: Tab goes around its buttons and fields
  if (e.key === 'Tab' && S.modal) {
    const dlg = $('.dlg');
    if (!dlg) return;
    const items = [...dlg.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]):not([type=hidden]), select, textarea, [tabindex]:not([tabindex="-1"])')]
      .filter(el => el.offsetParent !== null || el.matches('.vh'));
    if (!items.length) return;
    const first = items[0], last = items[items.length - 1];
    if (e.shiftKey && (document.activeElement === first || !dlg.contains(document.activeElement))) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && (document.activeElement === last || !dlg.contains(document.activeElement))) { e.preventDefault(); first.focus(); }
  }
});

// Pull down from the top to reload, only in the installed app (home-screen icon). It never starts while a window,
// the opening animation or typed text is on screen, so nothing the person wrote can be lost.
(function pullToRefresh() {
  const isApp = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if (!isApp) return;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const MAX = 130, GO = 70, HOLD = 56, C = 56.55;
  const main = document.getElementById('main');
  const ind = document.createElement('div');
  ind.setAttribute('aria-hidden', 'true');
  ind.style.cssText = 'position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;width:34px;height:34px;margin-left:-17px;border-radius:50%;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;place-items:center;z-index:60;pointer-events:none;opacity:0;color:var(--ac-text,var(--ac))';
  ind.innerHTML = '<svg id="ptr-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9" stroke-dasharray="' + C + '" stroke-dashoffset="' + C + '" transform="rotate(-90 12 12)"/></svg>';
  document.body.appendChild(ind);
  const st = document.createElement('style');
  st.textContent = '@keyframes ptr-spin{to{transform:rotate(360deg)}} #ptr-svg.spin{animation:ptr-spin .75s linear infinite} #ptr-svg.spin circle{stroke-dashoffset:' + (C * 0.28) + '!important}';
  document.head.appendChild(st);
  const svg = ind.querySelector('#ptr-svg'), arc = svg.querySelector('circle');
  document.documentElement.style.overscrollBehaviorY = 'contain';
  let y0 = null, dy = 0, busy = false;
  const blocked = () => performance.now() < 12000 || document.querySelector('.ov, .intro') || [...document.querySelectorAll('input:not([type=hidden]),textarea')].some(i => i.offsetParent !== null && i.value && i.type !== 'checkbox' && i.type !== 'radio');
  const place = (d, anim) => {
    const t = anim && !reduce ? 'transform .25s ease, opacity .2s' : 'none';
    main.style.transition = t; ind.style.transition = t;
    main.style.transform = d ? 'translateY(' + d + 'px)' : '';
    ind.style.opacity = Math.min(1, d / 28);
    ind.style.transform = 'translateY(' + (d * 0.55 - 6) + 'px)';
  };
  const progress = d => {
    const p = Math.min(1, d / GO);
    arc.style.strokeDashoffset = C * (1 - p);
    svg.style.transform = 'rotate(' + (p * 270) + 'deg)';
  };
  const reset = () => { place(0, true); setTimeout(() => { main.style.transition = ''; main.style.transform = ''; arc.style.strokeDashoffset = C; svg.style.transform = ''; }, 280); };
  addEventListener('touchstart', e => {
    if (busy || e.touches.length !== 1 || scrollY > 0 || blocked()) { y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0;
  }, { passive: true });
  addEventListener('touchmove', e => {
    if (y0 === null || busy) return;
    const pull = e.touches[0].clientY - y0;
    if (scrollY > 0 || pull <= 0) { if (dy > 0) { dy = 0; reset(); } if (pull <= 0 && scrollY <= 0) return; y0 = null; return; }
    dy = Math.min(MAX, pull * 0.5);
    if (dy > 4) {
      if (e.cancelable) e.preventDefault();
      progress(dy); place(dy, false);
    }
  }, { passive: false });
  addEventListener('touchend', () => {
    if (y0 === null || busy) return;
    y0 = null;
    if (dy >= GO) {
      busy = true;
      progress(GO); place(HOLD, true);
      if (!reduce) svg.classList.add('spin');
      setTimeout(() => location.reload(), reduce ? 100 : 650);
    } else if (dy > 0) reset();
    dy = 0;
  }, { passive: true });
  addEventListener('touchcancel', () => { if (y0 !== null && !busy) { y0 = null; dy = 0; reset(); } }, { passive: true });
})();

boot();

// ───────────── Local text editor (only on localhost, never on the live site) ─────────────
// Guy clicks "עריכת טקסט", clicks any text on the page and types. Each change is kept as
// {before, after} in localStorage 'kb_text_edits'; Claude reads that list and applies it to the
// source file. Nothing here changes the file or the database by itself.
(function localTextEditor() {
  if (!['localhost', '127.0.0.1'].includes(location.hostname)) return;
  const KEY = 'kb_text_edits';
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } };
  const save = list => { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {} };
  let edits = load();

  const bar = document.createElement('div');
  bar.className = 'te-bar';
  bar.innerHTML = `<button type="button" class="te-toggle">✏️ עריכת טקסט</button>
    <div class="te-panel" hidden>
      <b>מצב עריכה פעיל</b>
      <p>לוחצים על טקסט באתר ומקלידים. השינויים נשמרים כאן, ו־Claude מעביר אותם לאתר.</p>
      <label>טקסט הכניסה (שורה לכל שורה):<textarea class="te-intro" rows="2"></textarea></label>
      <ul class="te-list"></ul>
      <div class="te-row"><button type="button" class="te-done">סיימתי</button><button type="button" class="te-clear">מחיקת כל השינויים</button></div>
    </div>`;
  document.body.appendChild(bar);
  const panel = bar.querySelector('.te-panel');
  const intro = bar.querySelector('.te-intro');
  const introNow = INTRO_LINES.map(l => l.join(' ')).join('\n');
  const introEdit = edits.find(e => e.kind === 'intro');
  intro.value = introEdit ? introEdit.after : introNow;

  const listHtml = () => {
    bar.querySelector('.te-list').innerHTML = edits.length
      ? edits.map(e => `<li><s>${esc(e.before)}</s><br>← ${esc(e.after)}</li>`).join('')
      : '<li class="te-empty">עוד אין שינויים</li>';
  };
  const record = (before, after, kind) => {
    const old = edits.find(e => e.before === before && e.kind === kind);
    if (before === after) edits = edits.filter(e => e !== old);
    else if (old) old.after = after;
    else edits.push({ before, after, kind });
    save(edits); listHtml();
  };

  // Text-only elements become editable (anything with child elements, form fields and cards of
  // real projects/people from the database are left alone)
  const editable = () => {
    // Headings split into words for the animation go back to one plain sentence first
    document.querySelectorAll('#main [data-split]').forEach(el => {
      el.textContent = el.getAttribute('aria-label') || el.textContent;
      el.removeAttribute('aria-label');
      delete el.dataset.split;
    });
    return editableNow();
  };
  const editableNow = () => [...document.querySelectorAll('#main *, #modal *')].filter(el =>
    !el.children.length && el.textContent.trim() &&
    !el.closest('input, select, textarea, option, svg, .card[data-key], .te-bar, .ticker'));
  const onInput = e => {
    const el = e.target;
    if (!el.dataset || el.dataset.teOrig === undefined) return;
    record(el.dataset.teOrig, el.textContent.trim(), 'text');
  };
  const block = e => { if (window.__textEditOn && !e.target.closest('.te-bar')) { e.stopPropagation(); e.preventDefault(); } };
  const setOn = on => {
    window.__textEditOn = on;
    document.documentElement.classList.toggle('te-on', on);
    panel.hidden = !on;
    bar.querySelector('.te-toggle').textContent = on ? '✏️ עריכה פעילה' : '✏️ עריכת טקסט';
    editable().forEach(el => {
      if (on) { if (el.dataset.teOrig === undefined) el.dataset.teOrig = el.textContent.trim(); el.contentEditable = 'true'; }
      else el.removeAttribute('contenteditable');
    });
    listHtml();
  };
  bar.querySelector('.te-toggle').addEventListener('click', () => setOn(!window.__textEditOn));
  bar.querySelector('.te-done').addEventListener('click', () => { setOn(false); toast('השינויים נשמרו. אפשר לכתוב ל־Claude שסיימת.'); });
  bar.querySelector('.te-clear').addEventListener('click', () => { edits = []; save(edits); intro.value = introNow; listHtml(); });
  intro.addEventListener('input', () => record(introNow, intro.value.trim(), 'intro'));
  document.addEventListener('input', onInput, true);
  document.addEventListener('click', block, true);
  document.addEventListener('submit', block, true);
  document.addEventListener('keydown', e => { if (window.__textEditOn && e.key === 'Enter' && e.target.isContentEditable) e.preventDefault(); }, true);
  // Screens that open later (tabs, dialogs) become editable too
  new MutationObserver(() => { if (window.__textEditOn) setOn(true); }).observe(document.getElementById('main'), { childList: true });
  listHtml();
})();
</script>
